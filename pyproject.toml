[project]
name = "access-broker"
version = "0.1.0"
description = "ExifFlow replication authorization gateway"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.0",
]

[project.scripts]
access-broker = "access_broker.main:run"

[tool.uv]
package = true
