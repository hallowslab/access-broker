<div id="device-table" hx-get="/dashboard/table" hx-trigger="every 5s" hx-swap="outerHTML">
  <table>
    <thead>
      <tr><th>Device</th><th>Info</th><th>IP</th><th>Approved IPs</th><th>Status</th><th>Last seen</th><th>Registered</th><th>Storage config</th><th>Actions</th></tr>
    </thead>
    <tbody>
      {% for d in devices %}
      {% include "partials/device_row.html" %}
      {% else %}
      <tr><td colspan="9" class="empty">No devices registered yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
