<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ExifFlow Access Broker{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f7f7f8; color: #1c1c1e; }
    main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    table { border-collapse: collapse; width: 100%; background: #fff; border: 1px solid #e3e3e6; }
    th, td { text-align: left; padding: .55rem .75rem; border-bottom: 1px solid #ececf0; font-size: .85rem; }
    th { background: #f0f0f3; font-weight: 600; }
    code { background: #eef0f3; padding: .1rem .3rem; border-radius: 3px; font-size: .78rem; }
    .counts { margin-bottom: 1rem; color: #555; font-size: .9rem; }
    .badge { display: inline-block; padding: .1rem .55rem; border-radius: 999px; font-size: .75rem; font-weight: 600; }
    .pending { background: #fff3cd; color: #7a5b00; }
    .approved { background: #d1e7dd; color: #0f5132; }
    .deauthorized { background: #f8d7da; color: #842029; }
    .empty { padding: 2rem; text-align: center; color: #888; }
    .btn { border: 1px solid transparent; border-radius: 5px; padding: .3rem .65rem; font-size: .78rem; cursor: pointer; }
    .btn.ok { background: #d1e7dd; color: #0f5132; border-color: #a3cfbb; }
    .btn.ok:hover { background: #bcdcd0; }
    .btn.danger { background: #f8d7da; color: #842029; border-color: #f0b6bb; }
    .btn.danger:hover { background: #f2c0c4; }
    .cred-form label { display: block; margin: .6rem 0 .2rem; font-size: .8rem; color: #555; }
    .cred-form input, .cred-form select, .cred-form textarea { width: 100%; box-sizing: border-box; padding: .45rem .6rem; border: 1px solid #ccc; border-radius: 5px; font-size: .9rem; font-family: inherit; }
    .cred-form button { margin-top: 1rem; }
    .notice { padding: .6rem .8rem; border-radius: 5px; font-size: .85rem; margin-bottom: .8rem; }
    .notice.ok { background: #d1e7dd; color: #0f5132; }
    .notice.err { background: #f8d7da; color: #842029; }
    .hint { color: #888; font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
